name: Autonomous Recipe Extractor

on:
  push:
    paths:
      - 'recipe-inbox.json'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Recipe Extractor Cloud Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/extract-recipes.js

      - name: Commit and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat(recipes): auto-extract queued recipes [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase -X ours origin main && git push origin main && break || sleep 2
            done
          fi

      - name: Commit Failure Diagnostic
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sync-log.json
          git diff --staged --quiet || (git commit -m "chore(sync): record extraction failure diagnostic in sync-log.json [skip ci]" && git pull --rebase -X ours origin main && git push origin main) || true

