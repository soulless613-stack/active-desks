name: Autonomous Universal Extractor & Classifier

on:
  repository_dispatch:
    types: [extract_capture]
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the recipe, reel, or link to extract'
        required: true
      captureId:
        description: 'Firestore Capture Document ID'
        required: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Media Tools (ffmpeg & yt-dlp)
        run: |
          curl -sL https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | sudo tar -xJ --strip-components=2 -C /usr/local/bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          python3 -m pip install --upgrade --quiet yt-dlp

      - name: Install Firebase Client
        run: |
          npm install --no-audit --no-fund --prefer-offline firebase

      - name: Run Autonomous Extractor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_URL: ${{ github.event.client_payload.url || github.event.inputs.url }}
          CAPTURE_ID: ${{ github.event.client_payload.captureId || github.event.inputs.captureId }}
        run: |
          node scripts/universal-extractor.js
